name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: rdf-config
  RUST_BIN: rdf-config
  DOCKER_IMAGE: tnishi/rdf-config

jobs:
  # ============================================================
  # Rust CLI build + Ruby program packaging
  # ============================================================
  build:
    name: Build ${{ matrix.name }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # ------------------------------------------------------
          # Linux x86_64
          # Linuxのみ cross を使用
          # ------------------------------------------------------
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
            extension: ""
            archive: tar.gz

          # ------------------------------------------------------
          # Linux ARM64
          # Linuxのみ cross を使用
          # ------------------------------------------------------
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
            extension: ""
            archive: tar.gz

          # ------------------------------------------------------
          # macOS x86_64
          # ------------------------------------------------------
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            use_cross: false
            extension: ""
            archive: tar.gz

          # ------------------------------------------------------
          # macOS arm64
          # ------------------------------------------------------
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            extension: ""
            archive: tar.gz

          # ------------------------------------------------------
          # Windows x86_64
          # ------------------------------------------------------
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            extension: ".exe"
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ==========================================================
      # Rust setup
      # ==========================================================

      - name: Install Rust target
        if: ${{ !matrix.use_cross }}
        run: rustup target add ${{ matrix.target }}

      # Linuxだけcrossを使用
      - name: Install cross
        if: ${{ matrix.use_cross }}
        run: cargo install cross --locked

      # ==========================================================
      # Build Rust CLI
      # ==========================================================

      - name: Build Rust CLI with cross
        if: ${{ matrix.use_cross }}
        run: >
          cross build
          --release
          --target ${{ matrix.target }}
          --manifest-path rust/Cargo.toml
          --features all

      - name: Build Rust CLI with cargo
        if: ${{ !matrix.use_cross }}
        run: >
          cargo build
          --release
          --target ${{ matrix.target }}
          --manifest-path rust/Cargo.toml
          --features all

      # ==========================================================
      # Create package - Linux / macOS
      #
      # 配布パッケージ:
      #
      # rdf-config/
      #   *.rb
      #   lib/
      #   ...
      #   rust/
      #     target/
      #       release/
      #         rdf-config
      #
      # Ruby側から
      # rust/target/release/rdf-config
      # を呼び出せる状態にする
      # ==========================================================

      - name: Create package directory
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PACKAGE_DIR="${APP_NAME}-${GITHUB_REF_NAME}-${{ matrix.name }}"

          mkdir -p "dist/${PACKAGE_DIR}"

          rsync -a ./ "dist/${PACKAGE_DIR}/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            --exclude 'rust/target'

          mkdir -p \
            "dist/${PACKAGE_DIR}/rust/target/release"

          cp \
            "rust/target/${{ matrix.target }}/release/${RUST_BIN}${{ matrix.extension }}" \
            "dist/${PACKAGE_DIR}/rust/target/release/${RUST_BIN}${{ matrix.extension }}"

          chmod +x \
            "dist/${PACKAGE_DIR}/rust/target/release/${RUST_BIN}${{ matrix.extension }}"

      # ==========================================================
      # Create package - Windows
      # ==========================================================

      - name: Create package directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PackageDir = "${env:APP_NAME}-${env:GITHUB_REF_NAME}-${{ matrix.name }}"
          $Dest = "dist\$PackageDir"

          New-Item -ItemType Directory -Force -Path $Dest

          Get-ChildItem -Force |
            Where-Object {
              $_.Name -ne ".git" -and
              $_.Name -ne ".github" -and
              $_.Name -ne "dist"
            } |
            ForEach-Object {
              Copy-Item $_.FullName `
                -Destination $Dest `
                -Recurse `
                -Force
            }

          # 元のrust/targetを削除
          $TargetDir = "$Dest\rust\target"

          if (Test-Path $TargetDir) {
            Remove-Item $TargetDir -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$Dest\rust\target\release"

          Copy-Item `
            "rust\target\${{ matrix.target }}\release\${env:RUST_BIN}${{ matrix.extension }}" `
            "$Dest\rust\target\release\${env:RUST_BIN}${{ matrix.extension }}"

      # ==========================================================
      # Archive Linux / macOS
      # ==========================================================

      - name: Create tar.gz
        if: matrix.archive == 'tar.gz'
        shell: bash
        working-directory: dist
        run: |
          PACKAGE_DIR="${APP_NAME}-${GITHUB_REF_NAME}-${{ matrix.name }}"

          tar czf \
            "${PACKAGE_DIR}.tar.gz" \
            "${PACKAGE_DIR}"

      # ==========================================================
      # Archive Windows
      # ==========================================================

      - name: Create zip
        if: matrix.archive == 'zip'
        shell: pwsh
        working-directory: dist
        run: |
          $PackageDir = "${env:APP_NAME}-${env:GITHUB_REF_NAME}-${{ matrix.name }}"

          Compress-Archive `
            -Path $PackageDir `
            -DestinationPath "$PackageDir.zip"

      # ==========================================================
      # Upload artifact
      # ==========================================================

      - name: Upload release artifact
        if: matrix.archive == 'tar.gz'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Upload release artifact
        if: matrix.archive == 'zip'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ github.ref_name }}-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

  # ============================================================
  # GitHub Release
  # ============================================================
  release:
    name: Create GitHub Release

    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - build

    runs-on: ubuntu-latest

    steps:
      #
      # buildジョブで作成した全パッケージを取得
      #
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Show release files
        run: |
          find release -type f -maxdepth 2 -print

      #
      # GitHub Release 作成
      #
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.tar.gz
            release/*.zip

          generate_release_notes: true
