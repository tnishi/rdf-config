name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Rust CLI の実行ファイル名
  BINARY_NAME: rdf-config

  # 配布パッケージの名前
  PACKAGE_NAME: rdf-config

jobs:
  build:
    name: Build ${{ matrix.name }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # Linux x86_64 - musl + cross
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            build_tool: cross

          # Linux ARM64 - musl + cross
          - name: linux-aarch64
            os: ubuntu-24.04
            target: aarch64-unknown-linux-musl
            build_tool: cross

          # Windows x86_64
          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            build_tool: cargo

          # macOS Intel
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            build_tool: cargo

          # macOS Apple Silicon
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            build_tool: cargo

    steps:
      #
      # ソースコード取得
      #
      - name: Checkout
        uses: actions/checkout@v6

      #
      # Rust インストール
      #
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux のときだけ cross をインストール
      - name: Install cross
        if: matrix.build_tool == 'cross'
        run: cargo install cross --locked

      # Linux
      - name: Build with cross
        if: matrix.build_tool == 'cross'
        run: >
          cross build
          --release
          --target ${{ matrix.target }}
          --manifest-path rust/Cargo.toml
          --features all

      # Windows / macOS
      - name: Build with cargo
        if: matrix.build_tool == 'cargo'
        run: >
          cargo build
          --release
          --target ${{ matrix.target }}
          --manifest-path rust/Cargo.toml
          --features all

      #
      # Linux / macOS 向けパッケージ作成
      #
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eux

          VERSION="${GITHUB_REF_NAME}"
          DIST_NAME="${PACKAGE_NAME}-${VERSION}-${{ matrix.name }}"

          mkdir -p "${DIST_NAME}"

          #
          # Git管理対象のファイルを配布ディレクトリへコピー
          #
          git archive HEAD | tar -x -C "${DIST_NAME}"

          #
          # 配布物にはGitHub Actions設定は不要
          #
          rm -rf "${DIST_NAME}/.github"

          #
          # Rustソースとビルド途中のファイルを除去
          #
          rm -rf "${DIST_NAME}/rust"

          #
          # Rust CLI の配置先を作成
          #
          mkdir -p "${DIST_NAME}/rust/target/release"

          #
          # ビルド済みRustバイナリを配置
          #
          cp \
            "rust/target/${{ matrix.target }}/release/${BINARY_NAME}" \
            "${DIST_NAME}/rust/target/release/${BINARY_NAME}"

          #
          # 念のため実行権限を設定
          #
          chmod +x \
            "${DIST_NAME}/rust/target/release/${BINARY_NAME}"

          #
          # tar.gz 作成
          #
          tar czf "${DIST_NAME}.tar.gz" "${DIST_NAME}"

      #
      # Windows 向けパッケージ作成
      #
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ github.ref_name }}"
          $distName = "${env:PACKAGE_NAME}-${version}-${{ matrix.name }}"

          #
          # Git管理対象ファイルを一旦 zip にする
          #
          git archive `
            --format=zip `
            --output=source.zip `
            HEAD

          #
          # 配布ディレクトリへ展開
          #
          Expand-Archive `
            -Path source.zip `
            -DestinationPath $distName

          Remove-Item source.zip

          #
          # GitHub Actions設定は配布物から除外
          #
          if (Test-Path "$distName/.github") {
            Remove-Item `
              -Recurse `
              -Force `
              "$distName/.github"
          }

          #
          # Rustソースを配布物から除外
          #
          if (Test-Path "$distName/rust") {
            Remove-Item `
              -Recurse `
              -Force `
              "$distName/rust"
          }

          #
          # Rust CLI 配置ディレクトリ作成
          #
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "$distName/rust/target/release"

          #
          # Rust CLI を配置
          #
          Copy-Item `
            "rust/target/${{ matrix.target }}/release/${env:BINARY_NAME}.exe" `
            "$distName/rust/target/release/${env:BINARY_NAME}.exe"

          #
          # zip 作成
          #
          Compress-Archive `
            -Path $distName `
            -DestinationPath "${distName}.zip"

      #
      # 作成した配布ファイルを次のreleaseジョブへ渡す
      #
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.tar.gz
            *.zip


  #
  # 全OSのビルド成功後に GitHub Release を作成
  #
  release:
    name: Create GitHub Release

    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      #
      # buildジョブで作成した全パッケージを取得
      #
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Show artifacts
        run: |
          find artifacts -maxdepth 1 -type f -print

      #
      # GitHub Release 作成
      #
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
